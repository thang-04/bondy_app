<!DOCTYPE html>
<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bondy - Emotions Check-in (Light Mode)</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "background-soft": "#FDFBF7","surface-white": "#FFFFFF",
                        "text-primary": "#2D2A26",
                        "text-secondary": "#7D7A73",
                        "input-bg": "#F5F3F0",
                    },
                    backgroundImage: {
                        'brand-gradient': 'linear-gradient(135deg, #FF9A9E 0%, #FECFEF 100%)','brand-gradient-bold': 'linear-gradient(135deg, #FF6B6B 0%, #E056FD 100%)','brand-gradient-subtle': 'linear-gradient(135deg, rgba(255, 107, 107, 0.1) 0%, rgba(224, 86, 253, 0.1) 100%)',
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "Noto Sans", "sans-serif"],
                        "body": ["Noto Sans", "sans-serif"]
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'card': '0 2px 10px rgba(0, 0, 0, 0.03)',
                        'floating': '0 10px 40px -10px rgba(224, 86, 253, 0.3)',
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;
            background-color: #FDFBF7;
        }.scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4">
<div class="relative flex h-screen w-full max-w-[420px] flex-col overflow-hidden bg-background-soft sm:h-[844px] sm:rounded-[40px] shadow-2xl border border-white/50">
<div class="flex items-center justify-between p-4 pt-12 sm:pt-6 bg-background-soft z-10">
<button class="text-text-primary flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-100 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex-1 flex justify-center">
<div class="flex flex-col items-center">
<span class="text-[11px] font-bold text-text-secondary uppercase tracking-widest mb-1.5">Check-in Cảm Xúc</span>
<div class="w-16 h-1 bg-gray-200 rounded-full overflow-hidden">
<div class="h-full bg-brand-gradient-bold w-1/3 rounded-full"></div>
</div>
</div>
</div>
<div class="size-10"></div> 
</div>
<div class="flex-1 overflow-y-auto px-6 pb-28 scrollbar-hide">
<div class="mt-2 mb-8">
<h2 class="text-text-primary text-[28px] font-bold leading-[1.3] text-center font-display">
                    Hôm nay bạn<br/>cảm thấy thế nào?
                </h2>
<p class="text-center text-text-secondary mt-2 text-sm font-medium">Lắng nghe bản thân và chia sẻ nhé</p>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="group relative flex flex-col items-center justify-center gap-3 p-5 rounded-3xl bg-surface-white hover:shadow-soft transition-all cursor-pointer shadow-card border border-transparent hover:border-pink-200">
<div class="w-16 h-16 rounded-full bg-[#FFF5F5] flex items-center justify-center text-4xl mb-1 group-hover:scale-110 transition-transform duration-300">
                        😊
                    </div>
<span class="text-text-primary font-bold text-sm">Hạnh phúc</span>
</button>
<button class="group relative flex flex-col items-center justify-center gap-3 p-5 rounded-3xl bg-surface-white hover:shadow-soft transition-all cursor-pointer shadow-card border border-transparent hover:border-pink-200">
<div class="w-16 h-16 rounded-full bg-[#F7F7F7] flex items-center justify-center text-4xl mb-1 group-hover:scale-110 transition-transform duration-300">
                        😐
                    </div>
<span class="text-text-primary font-bold text-sm">Bình thường</span>
</button>
<button class="group relative flex flex-col items-center justify-center gap-3 p-5 rounded-3xl bg-surface-white hover:shadow-soft transition-all cursor-pointer shadow-card border border-transparent hover:border-pink-200">
<div class="w-16 h-16 rounded-full bg-[#F0F7FF] flex items-center justify-center text-4xl mb-1 group-hover:scale-110 transition-transform duration-300">
                        😢
                    </div>
<span class="text-text-primary font-bold text-sm">Buồn</span>
</button>
<button class="group relative flex flex-col items-center justify-center gap-3 p-5 rounded-3xl bg-surface-white ring-2 ring-[#FF6B6B] ring-offset-2 ring-offset-[#FDFBF7] shadow-lg transition-all cursor-pointer">
<div class="absolute top-3 right-3 text-[#FF6B6B]">
<span class="material-symbols-outlined text-[22px] font-bold filled">check_circle</span>
</div>
<div class="w-16 h-16 rounded-full bg-[#FFF0F0] flex items-center justify-center text-4xl mb-1 scale-110">
                        😰
                    </div>
<span class="text-text-primary font-bold text-sm">Áp lực</span>
</button>
</div>
<div class="mt-8">
<div class="relative overflow-hidden rounded-3xl bg-brand-gradient-bold p-[1px] shadow-lg shadow-pink-200/50">
<div class="bg-white/95 h-full w-full rounded-[23px] p-5 relative overflow-hidden backdrop-blur-sm">
<div class="absolute inset-0 bg-brand-gradient-subtle opacity-30"></div>
<div class="absolute -right-6 -top-6 opacity-10 rotate-12 pointer-events-none">
<span class="material-symbols-outlined text-[120px] bg-clip-text text-transparent bg-brand-gradient-bold">spa</span>
</div>
<div class="relative z-10 flex flex-col gap-4">
<div class="flex items-start gap-3">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-gradient-bold text-white shadow-md">
<span class="material-symbols-outlined text-[20px]">smart_toy</span>
</div>
<div class="flex flex-col gap-1 pr-4">
<p class="text-transparent bg-clip-text bg-brand-gradient-bold text-sm font-bold leading-tight">Bondy Coach</p>
<p class="text-text-primary text-sm font-medium leading-relaxed">
                                        Thấy bạn đang áp lực, Bondy gợi ý một lời hỏi thăm nhẹ nhàng để bạn gửi đi.
                                    </p>
</div>
</div>
<button class="ml-auto w-full sm:w-auto flex items-center justify-center gap-2 rounded-xl h-9 px-4 bg-gray-50 hover:bg-white text-gray-800 text-xs font-bold shadow-sm transition-all border border-gray-100 group">
<span class="material-symbols-outlined text-[16px] text-[#E056FD] group-hover:scale-110 transition-transform">lightbulb</span>
                                Xem gợi ý
                            </button>
</div>
</div>
</div>
</div>
<div class="mt-8 flex flex-col gap-3">
<label class="text-text-primary text-sm font-bold pl-1" for="notes">Ghi chú thêm</label>
<div class="relative group">
<textarea class="w-full resize-none rounded-2xl bg-surface-white border-0 p-4 text-text-primary placeholder:text-gray-400 focus:ring-2 focus:ring-pink-300 text-sm leading-relaxed shadow-card transition-all" id="notes" placeholder="Có chuyện gì cụ thể đang làm bạn bận tâm không?..." rows="3"></textarea>
<div class="absolute bottom-3 right-3 text-gray-300 group-focus-within:text-pink-400 transition-colors">
<span class="material-symbols-outlined text-[20px]">edit_note</span>
</div>
</div>
</div>
<div class="h-8"></div>
</div>
<div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#FDFBF7] via-[#FDFBF7]/95 to-transparent z-20">
<button class="w-full flex items-center justify-center gap-2 h-14 rounded-2xl bg-brand-gradient-bold text-white text-base font-bold transition-transform shadow-floating active:scale-[0.98] hover:shadow-lg">
                Chia sẻ với người ấy
                <span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>

</body></html>

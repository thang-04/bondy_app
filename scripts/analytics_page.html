<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bondy App Analytics</title>

  <!-- Google Analytics gtag.js -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XD4HYE0MPD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XD4HYE0MPD', {
      send_page_view: true,
      cookie_flags: 'SameSite=None;Secure',
      debug_mode: true
    });

    // ============================================================
    // Kịch bản hành trình người dùng Bondy App
    // Tập trung: AI Hub (Chat AI) + Healing (Thiền & Khóa học)
    // Mô phỏng: User mở app → dùng → tắt → QUAY LẠI dùng tiếp
    // Tổng thời gian session: ~10-12 phút
    // ============================================================

    const EVENTS = [
      // ========== SESSION 1: Đăng ký & Khám phá ==========
      { name: 'app_open', params: {} },
      { name: 'screen_view', params: { firebase_screen: 'HomeScreen', firebase_screen_class: 'HomeScreen' } },
      { name: 'signup_start', params: {} },
      { name: 'signup_complete', params: { userId: 'user_' + Math.random().toString(36).substr(2, 8) } },
      { name: 'profile_complete', params: {} },
      { name: 'screen_view', params: { firebase_screen: 'DiscoverScreen', firebase_screen_class: 'DiscoverScreen' } },
      { name: 'discover_view', params: {} },
      { name: 'swipe_like', params: { targetUserId: 'target_' + Math.random().toString(36).substr(2, 8) } },
      { name: 'swipe_pass', params: { targetUserId: 'target_' + Math.random().toString(36).substr(2, 8) } },
      { name: 'swipe_like', params: { targetUserId: 'target_' + Math.random().toString(36).substr(2, 8) } },

      // ========== PHẦN 1: AI HUB — Trò chuyện với AI Bot (LẦN 1) ==========
      { name: 'screen_view', params: { firebase_screen: 'AIHubScreen', firebase_screen_class: 'AIHubScreen' } },
      { name: 'chat_opened', params: { chatId: 'ai_chat_bot' } },
      { name: 'screen_view', params: { firebase_screen: 'ChatDetailScreen', firebase_screen_class: 'ChatDetailScreen' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'emoji' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'image' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_chat_bot', messageType: 'text' } },

      // ========== PHẦN 2: HEALING — Check-in & Khóa thiền (LẦN 1) ==========
      { name: 'screen_view', params: { firebase_screen: 'HealingScreen', firebase_screen_class: 'HealingScreen' } },
      { name: 'healing_checkin', params: { checkinType: 'mood_happy' } },
      { name: 'healing_course_started', params: { courseId: 'meditation_101' } },
      { name: 'screen_view', params: { firebase_screen: 'HealingScreen', firebase_screen_class: 'HealingScreen' } },
      { name: 'healing_course_started', params: { courseId: 'breathing_exercise' } },
      { name: 'healing_course_started', params: { courseId: 'self_care_daily' } },
      { name: 'healing_checkin', params: { checkinType: 'journal_entry' } },

      // ========== PHẦN 3: Duyệt thêm — Match & Paywall ==========
      { name: 'screen_view', params: { firebase_screen: 'DiscoverScreen', firebase_screen_class: 'DiscoverScreen' } },
      { name: 'swipe_like', params: { targetUserId: 'target_' + Math.random().toString(36).substr(2, 8) } },
      { name: 'match_created', params: { matchId: 'match_' + Math.random().toString(36).substr(2, 12) } },
      { name: 'screen_view', params: { firebase_screen: 'MatchesScreen', firebase_screen_class: 'MatchesScreen' } },
      { name: 'match_confirmed', params: { matchId: 'match_' + Math.random().toString(36).substr(2, 12) } },
      { name: 'subscription_paywall_view', params: {} },
      { name: 'screen_view', params: { firebase_screen: 'PremiumPaywallScreen', firebase_screen_class: 'PremiumPaywallScreen' } },

      // ========== QUAY LẠI AI HUB (LẦN 2) — User quay lại chat tiếp ==========
      { name: 'screen_view', params: { firebase_screen: 'AIHubScreen', firebase_screen_class: 'AIHubScreen' } },
      { name: 'chat_opened', params: { chatId: 'ai_relationship_advisor' } },
      { name: 'screen_view', params: { firebase_screen: 'ChatDetailScreen', firebase_screen_class: 'ChatDetailScreen' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'emoji' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_relationship_advisor', messageType: 'text' } },

      // ========== QUAY LẠI HEALING (LẦN 2) — User thiền buổi tối ==========
      { name: 'screen_view', params: { firebase_screen: 'HealingScreen', firebase_screen_class: 'HealingScreen' } },
      { name: 'healing_checkin', params: { checkinType: 'mood_calm' } },
      { name: 'healing_course_started', params: { courseId: 'evening_meditation' } },
      { name: 'healing_course_started', params: { courseId: 'gratitude_journal' } },
      { name: 'healing_checkin', params: { checkinType: 'reflect_end_day' } },
      { name: 'screen_view', params: { firebase_screen: 'HealingScreen', firebase_screen_class: 'HealingScreen' } },
      { name: 'healing_course_started', params: { courseId: 'sleep_story' } },

      // ========== QUAY LẠI AI HUB (LẦN 3) — Hỏi thêm AI ==========
      { name: 'screen_view', params: { firebase_screen: 'AIHubScreen', firebase_screen_class: 'AIHubScreen' } },
      { name: 'chat_opened', params: { chatId: 'ai_mood_coach' } },
      { name: 'screen_view', params: { firebase_screen: 'ChatDetailScreen', firebase_screen_class: 'ChatDetailScreen' } },
      { name: 'message_sent', params: { chatId: 'ai_mood_coach', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_mood_coach', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_mood_coach', messageType: 'text' } },
      { name: 'message_sent', params: { chatId: 'ai_mood_coach', messageType: 'emoji' } },

      // ========== KẾT THÚC: Xem Profile & Settings ==========
      { name: 'screen_view', params: { firebase_screen: 'ProfileScreen', firebase_screen_class: 'ProfileScreen' } },
      { name: 'screen_view', params: { firebase_screen: 'SettingsScreen', firebase_screen_class: 'SettingsScreen' } },
    ];

    // ---- Gửi events tuần tự với delay mô phỏng người dùng thật ----
    let eventIndex = 0;
    let totalSent = 0;
    const startTime = Date.now();

    function getRandomDelay() {
      // 8s - 18s giữa các event (trung bình ~13s)
      // Tổng: ~63 events × 13s = ~819s (~13.6 phút)
      return Math.floor(Math.random() * 10000) + 8000;
    }

    function sendNextEvent() {
      if (eventIndex >= EVENTS.length) {
        const elapsed = Math.round((Date.now() - startTime) / 1000);
        updateStatus('✅ Hoàn thành! Đã gửi ' + totalSent + ' events trong ' + elapsed + 's. Tab sẽ đóng sau 5 giây.');
        // Tự đóng tab sau 5 giây
        setTimeout(() => { window.close(); }, 5000);
        return;
      }

      const event = EVENTS[eventIndex];
      // engagement_time_msec: 20s - 60s cho mỗi event (trung bình 40s)
      const params = { ...event.params, engagement_time_msec: Math.floor(Math.random() * 40000) + 20000 };
      gtag('event', event.name, params);
      totalSent++;
      eventIndex++;

      updateStatus('📡 [' + totalSent + '/' + EVENTS.length + '] ' + event.name);
      setTimeout(sendNextEvent, getRandomDelay());
    }

    function updateStatus(text) {
      const el = document.getElementById('status');
      if (el) el.textContent = text;
      console.log(text);
    }

    // Bắt đầu gửi events sau khi gtag.js load xong (3 giây)
    setTimeout(() => {
      updateStatus('🚀 Bắt đầu gửi events...');
      sendNextEvent();
    }, 3000);
  </script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: #eee;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #16213e;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      max-width: 500px;
    }
    h1 { color: #e94560; margin-bottom: 8px; }
    #status { 
      margin-top: 20px; 
      padding: 12px 20px;
      background: #0f3460;
      border-radius: 8px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bondy App</h1>
    <p>Analytics Event Simulator</p>
    <div id="status">⏳ Đang tải gtag.js...</div>
  </div>
</body>
</html>
